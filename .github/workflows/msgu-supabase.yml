name: MsgU Supabase Android Preview
on:
  push:
    branches: [msgu-supabase-internet-chat]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build MsgU Internet APK
        run: gradle --no-daemon --stacktrace :msgu:assembleDebug :msgu:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: MsgU-Supabase-Internet-Debug-APK
          path: msgu/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
