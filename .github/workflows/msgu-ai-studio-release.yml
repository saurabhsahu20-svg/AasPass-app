name: MsgU v1.1.1 Login Fix – Android + Firestore Tests + GitHub Beta

on:
  push:
    branches: [msgu-ai-studio-v1-1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Extract MsgU and apply login fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-source
          unzip -q release-inputs/MsgU-v1.1.0-source.zip -d ci-source
          cp release-inputs/google-services.json ci-source/app/google-services.json
          python3 release-inputs/apply_login_fix.py
          grep -q 'versionCode = 3' ci-source/app/build.gradle.kts
          grep -q 'onEmailSignInClicked' ci-source/app/src/main/java/com/example/ui/screens/AuthScreen.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure CI debug signing key
        env:
          MSGU_DEBUG_KEYSTORE_B64: ${{ secrets.MSGU_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MSGU_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$MSGU_DEBUG_KEYSTORE_B64" | base64 --decode > ci-source/debug.keystore
          else
            keytool -genkeypair -keystore ci-source/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 3650 -dname 'CN=MsgU GitHub CI Debug,O=MsgU,C=IN' -noprompt
          fi
      - name: Compile Android APK + Android unit tests
        run: |
          cd ci-source
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Prepare APK, SHA256 and signing SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp ci-source/app/build/outputs/apk/debug/app-debug.apk release/MsgU-v1.1.1-Login-Fix-Debug.apk
          (cd release && sha256sum MsgU-v1.1.1-Login-Fix-Debug.apk > MsgU-v1.1.1-Login-Fix-Debug.sha256)
          keytool -list -v -keystore ci-source/debug.keystore -alias androiddebugkey \
            -storepass android | grep 'SHA1:' | sed 's/^[[:space:]]*//' \
            > release/MsgU-v1.1.1-Signing-SHA1.txt
          cat release/MsgU-v1.1.1-Signing-SHA1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MsgU-v1.1.1-Login-Fix-APK
          path: release/
          if-no-files-found: error

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract exact Firestore rules from MsgU source
        run: |
          mkdir -p ci-source
          unzip -q release-inputs/MsgU-v1.1.0-source.zip -d ci-source
          cp release-inputs/firestore-smoke.cjs ci-source/firestore-smoke.cjs
      - name: Install Firebase emulator test dependencies
        run: |
          cd ci-source
          npm init -y >/dev/null
          npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Test two-user send receive reply and privacy permissions
        env:
          GCLOUD_PROJECT: demo-msguchat
        run: |
          cd ci-source
          npx firebase emulators:exec --project demo-msguchat --only firestore \
            'node --test firestore-smoke.cjs'

  publish:
    needs: [android, firestore-rules]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MsgU-v1.1.1-Login-Fix-APK
          path: release
      - name: Publish beta only after both checks succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='msgu-ai-studio-v1.1.1-login-fix-beta'
          notes='Android APK compiled and unit tests passed. Firestore Emulator two-identity messaging and security test passed. This does NOT prove real Google login or messaging on two physical devices. Firebase owner must register this APK SHA-1 and enable Google or Email/Password provider. CI debug signing key differs from previous builds. Do not install over an app signed with a different key.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title 'MsgU v1.1.1 – Login Fix + Firestore Tested (Debug Beta)' \
              --notes "$notes" \
              --prerelease
          fi
