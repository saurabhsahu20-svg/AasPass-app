name: AasPass validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project source presence
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
