name: MsgU Android + Backend CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and backend helper tests
        run: |
          npm --prefix firebase/functions run lint
          npm --prefix firebase/functions test
      - name: Source manifest and asset checks
        run: python3 qa/verify_project.py

  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Absence of google-services.json intentionally compiles a setup-required screen.
      # Integration tests MUST still run with the real secret via secure CI setup.
      - name: Compile app + unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsgU-Email-Phone-Beta-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish MsgU debug preview
    needs: [backend-static, android-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish MsgU v0.8.2 preview') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MsgU-Smooth-debug-APK
          path: downloaded-apk
      - name: Prepare preview APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p release
          cp "$apk" release/MsgU-v0.8.2-Smooth-Debug.apk
          (cd release && sha256sum MsgU-v0.8.2-Smooth-Debug.apk > MsgU-v0.8.2-Smooth-Debug.sha256)
      - name: Publish public GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.8.2-msgu-preview
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/MsgU-v0.8.2-Smooth-Debug.apk release/MsgU-v0.8.2-Smooth-Debug.sha256 --clobber
          else
            gh release create "$RELEASE_TAG"               release/MsgU-v0.8.2-Smooth-Debug.apk               release/MsgU-v0.8.2-Smooth-Debug.sha256               --target "$GITHUB_SHA"               --title "MsgU v0.8.2 Smooth — Debug Preview"               --notes-file RELEASE_NOTES_MSGU_V082.md               --prerelease
          fi
